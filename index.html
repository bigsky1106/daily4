<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>DAILY 4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-weight:800;font-size:25px;letter-spacing:-1px}.date{color:#6b6f76;font-size:14px}
nav{display:flex;gap:8px;margin-bottom:18px;overflow:auto}nav button{border:0;background:#e9e9e6;padding:9px 15px;border-radius:999px;color:#666;white-space:nowrap}nav button.active{background:#202124;color:#fff}
.card{background:#fff;border:1px solid #e5e5e1;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
h1,h2,h3,p{margin-top:0}h2{font-size:18px;margin-bottom:4px}.muted{color:#777;font-size:13px}
.progress{height:8px;background:#e9e9e7;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#3267d6;border-radius:99px;transition:.2s}
.block{display:flex;align-items:center;gap:12px;border:1px solid #e8e8e5;border-radius:14px;padding:13px;margin:9px 0;background:#fff}
.num{width:30px;height:30px;border-radius:9px;background:#f0f1f3;display:grid;place-items:center;font-weight:700;font-size:13px}
.task{flex:1;min-width:0}.task strong{display:block}.done{text-decoration:line-through;color:#999}.check{width:28px;height:28px;border-radius:50%;border:2px solid #bbb;background:#fff}.check.on{background:#3267d6;border-color:#3267d6;color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.primary{width:100%;border:0;background:#202124;color:#fff;padding:13px;border-radius:12px;font-weight:700}.secondary{border:0;background:#eee;padding:10px 13px;border-radius:10px}
input,select{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;background:#fff}
.goal{padding:12px 0;border-bottom:1px solid #eee}.goal:last-child{border:0}.goalhead{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;background:#eef2ff;color:#315fc5;border-radius:999px;padding:4px 8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:58px;border:1px solid #eee;border-radius:9px;padding:5px;font-size:11px;background:#fff}.day .dots{font-size:12px;margin-top:6px}.day.active{border-color:#3267d6}
.hidden{display:none}.empty{text-align:center;padding:28px 10px;color:#888}
</style>
</head>
<body>
<div class="app">
<header><div><div class="logo">DAILY 4</div><div class="date" id="todayDate"></div></div></header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const KEY="daily4_data_v1";
const days=["日","月","火","水","木","金","土"];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{settings:{blocks:4,duration:30},goals:[],logs:{}};
let view="today";
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function iso(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function labelDate(s){const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`}
function today(){return iso()}
function getLog(s=today()){if(!data.logs[s])data.logs[s]={blocks:[]};return data.logs[s]}
function ensureBlocks(){let l=getLog();while(l.blocks.length<data.settings.blocks)l.blocks.push({task:"",done:false,goalId:""});if(l.blocks.length>data.settings.blocks)l.blocks=l.blocks.slice(0,data.settings.blocks);return l}
function nav(){document.getElementById("nav").innerHTML=["today","history","goals","stats"].map(x=>`<button class="${view===x?"active":""}" onclick="view='${x}';render()">${{today:"今日",history:"履歴",goals:"目標",stats:"分析"}[x]}</button>`).join("")}
function render(){nav();document.getElementById("todayDate").textContent=labelDate(today());({today:renderToday,history:renderHistory,goals:renderGoals,stats:renderStats}[view])()}
function renderToday(){
 const l=ensureBlocks(),done=l.blocks.filter(b=>b.done).length,pct=Math.round(done/l.blocks.length*100);
 let rec=recommend();
 document.getElementById("main").innerHTML=`
 <section class="card"><h2>今日の4コマ</h2><div class="muted">${done}/${l.blocks.length} 完了 ・ 1ブロック ${data.settings.duration}分</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>
 ${l.blocks.map((b,i)=>`<div class="block"><div class="num">${i+1}</div><div class="task"><input value="${esc(b.task)}" placeholder="やることを入力" onchange="setTask(${i},this.value)" class="${b.done?'done':''}"></div><button class="check ${b.done?'on':''}" onclick="toggle(${i})">${b.done?"✓":""}</button></div>`).join("")}
 <button class="secondary" onclick="addBlock()">＋ ブロック追加</button></section>
 ${rec?`<section class="card"><h2>💡 今日のおすすめ</h2><p style="margin:8px 0">${rec.text}</p><button class="primary" onclick="useRec('${rec.id}')">この目標を追加</button></section>`:""}
 <section class="card"><h2>⚙ 設定</h2><div class="row"><label>標準ブロック数<select onchange="data.settings.blocks=+this.value;save()">${[2,3,4,5,6,7,8].map(n=>`<option ${data.settings.blocks===n?"selected":""}>${n}</option>`).join("")}</select></label><label>1ブロック<select onchange="data.settings.duration=+this.value;save()">${[15,20,30,45,60,90].map(n=>`<option ${data.settings.duration===n?"selected":""}>${n}分</option>`).join("")}</select></label></div></section>`;
}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function setTask(i,v){ensureBlocks().blocks[i].task=v;localStorage.setItem(KEY,JSON.stringify(data))}
function toggle(i){ensureBlocks().blocks[i].done=!ensureBlocks().blocks[i].done;save()}
function addBlock(){ensureBlocks().blocks.push({task:"",done:false,goalId:""});data.settings.blocks=Math.max(data.settings.blocks,ensureBlocks().blocks.length);save()}
function recommend(){
 if(!data.goals.length)return null;
 const now=new Date();let best=null;
 for(const g of data.goals){
  const count=Object.values(data.logs).reduce((n,l)=>n+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);
  const monthPrefix=iso(now).slice(0,7), monthCount=Object.entries(data.logs).filter(([d])=>d.startsWith(monthPrefix)).reduce((n,[,l])=>n+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);
  const score=(g.priority||2)*2+(g.target>0?Math.max(0,g.target-monthCount):0);
  if(!best||score>best.score)best={id:g.id,score,text:`「${g.name}」は今月 ${monthCount}/${g.target||"∞"}回。${g.target&&monthCount<g.target?"少し遅れ気味なので、今日はこれがおすすめ。":"今日の候補に入れておくのがおすすめ。"}`};
 }
 return best;
}
function useRec(id){let l=ensureBlocks();let i=l.blocks.findIndex(b=>!b.task);if(i<0){alert("空いているブロックがありません。");return}l.blocks[i].task=data.goals.find(g=>g.id===id)?.name||"";l.blocks[i].goalId=id;save()}
function renderHistory(){
 const now=new Date(),arr=[];for(let i=13;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);arr.push(iso(d))}
 document.getElementById("main").innerHTML=`<section class="card"><h2>過去14日</h2><p class="muted">どの日に何コマやったかを一目で確認できます。</p><div class="calendar">${arr.map(s=>{let l=data.logs[s],done=l?.blocks.filter(b=>b.done).length||0,total=l?.blocks.length||0;return `<div class="day"><b>${labelDate(s).slice(2)}</b><div class="dots">${total?`${done}/${total} コマ`:"—"}</div></div>`}).join("")}</div></section>
 <section class="card"><h2>最近の記録</h2>${arr.reverse().map(s=>{let l=data.logs[s];if(!l)return "";let bs=l.blocks.filter(b=>b.task);return `<div class="goal"><b>${labelDate(s)}</b><div class="muted">${bs.length?bs.map(b=>(b.done?"✓ ":"□ ")+esc(b.task)).join("　"): "記録なし"}</div></div>`}).join("")}</section>`;
}
function renderGoals(){
 document.getElementById("main").innerHTML=`<section class="card"><h2>やりたいことを登録</h2><div class="row"><input id="gname" placeholder="例：読書"><input id="gtarget" type="number" min="0" placeholder="月目標回数"></div><div class="row" style="margin-top:8px"><select id="gpriority"><option value="1">低</option><option value="2" selected>普通</option><option value="3">高</option></select><button class="primary" onclick="addGoal()">追加</button></div></section>
 <section class="card"><h2>目標一覧</h2>${data.goals.length?data.goals.map(g=>`<div class="goal"><div class="goalhead"><b>${esc(g.name)}</b><span class="tag">月 ${g.target||"—"}回</span></div><div class="muted">優先度：${["","低","普通","高"][g.priority]||"普通"}　<button class="secondary" onclick="deleteGoal('${g.id}')">削除</button></div></div>`).join(""):`<div class="empty">まだ目標がありません</div>`}</section>`;
}
function addGoal(){let n=document.getElementById("gname").value.trim(),t=+document.getElementById("gtarget").value||0,p=+document.getElementById("gpriority").value;if(!n)return alert("目標名を入力してください");data.goals.push({id:Date.now().toString(),name:n,target:t,priority:p});save()}
function deleteGoal(id){if(confirm("この目標を削除しますか？")){data.goals=data.goals.filter(g=>g.id!==id);save()}}
function renderStats(){
 const prefix=today().slice(0,7), logs=Object.entries(data.logs).filter(([d])=>d.startsWith(prefix));
 const total=logs.reduce((n,[,l])=>n+l.blocks.length,0),done=logs.reduce((n,[,l])=>n+l.blocks.filter(b=>b.done).length,0);
 document.getElementById("main").innerHTML=`<section class="card"><h2>${prefix.replace("-","年")}月の実績</h2><div class="row"><div><b style="font-size:26px">${total}</b><div class="muted">総コマ</div></div><div><b style="font-size:26px">${done}</b><div class="muted">完了</div></div><div><b style="font-size:26px">${total?Math.round(done/total*100):0}%</b><div class="muted">完了率</div></div></div></section>
 <section class="card"><h2>目標の進み具合</h2>${data.goals.length?data.goals.map(g=>{let n=logs.reduce((x,[,l])=>x+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);let p=g.target?Math.min(100,Math.round(n/g.target*100)):0;return `<div class="goal"><div class="goalhead"><b>${esc(g.name)}</b><span>${n}/${g.target||"—"}</span></div><div class="progress"><div class="bar" style="width:${p}%"></div></div></div>`}).join(""):`<div class="empty">目標を登録すると進捗が表示されます</div>`}</section>`;
}
render();
</script>
</body>
</html>
