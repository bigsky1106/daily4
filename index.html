<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f5">
<title>DAILY 4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:720px;margin:auto;padding:20px 16px 90px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-weight:800;font-size:25px;letter-spacing:-1px}.date{color:#6b6f76;font-size:14px}
nav{display:flex;gap:8px;margin-bottom:18px;overflow:auto}nav button{border:0;background:#e9e9e6;padding:9px 15px;border-radius:999px;color:#666;white-space:nowrap}nav button.active{background:#202124;color:#fff}
.card{background:#fff;border:1px solid #e5e5e1;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
h1,h2,h3,p{margin-top:0}h2{font-size:18px;margin-bottom:4px}.muted{color:#777;font-size:13px}
.progress{height:8px;background:#e9e9e7;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#3267d6;border-radius:99px;transition:.2s}
.block{display:flex;align-items:center;gap:12px;border:1px solid #e8e8e5;border-radius:14px;padding:13px;margin:9px 0;background:#fff}
.num{width:30px;height:30px;border-radius:9px;background:#f0f1f3;display:grid;place-items:center;font-weight:700;font-size:13px}
.task{flex:1;min-width:0}.task strong{display:block}.done{text-decoration:line-through;color:#999}.check{width:28px;height:28px;border-radius:50%;border:2px solid #bbb;background:#fff}.check.on{background:#3267d6;border-color:#3267d6;color:#fff}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.primary{width:100%;border:0;background:#202124;color:#fff;padding:13px;border-radius:12px;font-weight:700}.secondary{border:0;background:#eee;padding:10px 13px;border-radius:10px}
input,select{width:100%;border:1px solid #ddd;border-radius:10px;padding:11px;background:#fff}
.goal{padding:12px 0;border-bottom:1px solid #eee}.goal:last-child{border:0}.goalhead{display:flex;justify-content:space-between;gap:10px}.tag{font-size:11px;background:#eef2ff;color:#315fc5;border-radius:999px;padding:4px 8px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:58px;border:1px solid #eee;border-radius:9px;padding:5px;font-size:11px;background:#fff}.day .dots{font-size:12px;margin-top:6px}.day.active{border-color:#3267d6}
.hidden{display:none}.empty{text-align:center;padding:28px 10px;color:#888}
.goal-list{margin-top:10px;border-top:1px solid #eee}
.goal-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eee}
.goal-row:last-child{border-bottom:0}
.goal-main{flex:1;min-width:0}
.goal-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-meta{font-size:11px;color:#777;margin-top:3px}
.goal-actions{display:flex;gap:5px}
.mini{border:0;background:#eee;padding:6px 9px;border-radius:8px;font-size:12px}
.chips{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}
.chip{flex:0 0 auto;border:0;background:#eee;padding:7px 11px;border-radius:999px;font-size:12px}
.chip.active{background:#202124;color:#fff}
.modal{position:fixed;inset:0;background:#0005;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal-card{background:#fff;width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px 16px 28px;max-height:88vh;overflow:auto}
.days{display:flex;gap:5px;flex-wrap:wrap}.days label{font-size:12px}.days input{width:auto}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{border:1px solid #eee;border-radius:12px;padding:12px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:#777}
.barline{height:7px;background:#eee;border-radius:99px;overflow:hidden;margin-top:7px}.barline>i{display:block;height:100%;background:#3267d6;border-radius:99px}
.chart{display:flex;align-items:flex-end;gap:7px;height:140px;padding:10px 0}.barcol{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:flex-end}.barcol i{display:block;background:#3267d6;border-radius:6px 6px 2px 2px;min-height:3px}.barcol small{font-size:9px;color:#777;margin-top:4px}

</style>
</head>
<body>
<div class="app">
<header><div><div class="logo">DAILY 4</div><div class="date" id="todayDate"></div></div></header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const KEY="daily4_data_v1";
const days=["日","月","火","水","木","金","土"];
let data=JSON.parse(localStorage.getItem(KEY)||"null")||{settings:{blocks:4,duration:30},goals:[],logs:{}};
let view="today";
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function iso(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function labelDate(s){const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`}
function today(){return iso()}
function getLog(s=today()){if(!data.logs[s])data.logs[s]={blocks:[]};return data.logs[s]}
function ensureBlocks(){let l=getLog();while(l.blocks.length<data.settings.blocks)l.blocks.push({task:"",done:false,goalId:""});if(l.blocks.length>data.settings.blocks)l.blocks=l.blocks.slice(0,data.settings.blocks);return l}
function nav(){document.getElementById("nav").innerHTML=["today","history","goals","stats"].map(x=>`<button class="${view===x?"active":""}" onclick="view='${x}';render()">${{today:"今日",history:"履歴",goals:"目標",stats:"分析"}[x]}</button>`).join("")}
function render(){nav();document.getElementById("todayDate").textContent=labelDate(today());({today:renderToday,history:renderHistory,goals:renderGoals,stats:renderStats}[view])()}
function renderToday(){
 const l=ensureBlocks(),done=l.blocks.filter(b=>b.done).length,pct=Math.round(done/l.blocks.length*100);
 let rec=recommend();
 document.getElementById("main").innerHTML=`
 <section class="card"><h2>今日の4コマ</h2><div class="muted">${done}/${l.blocks.length} 完了 ・ 1ブロック ${data.settings.duration}分</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div>
 ${l.blocks.map((b,i)=>`<div class="block"><div class="num">${i+1}</div><div class="task"><input id="task-${i}" value="${esc(b.task)}" placeholder="やることを入力" onfocus="showTaskCandidates(${i})" oninput="showTaskCandidates(${i},this.value)" onchange="setTask(${i},this.value)" class="${b.done?'done':''}"><div id="cand-${i}" class="suggest hidden"></div></div><button class="check ${b.done?'on':''}" onclick="toggle(${i})">${b.done?"✓":""}</button></div>`).join("")}
 <button class="secondary" onclick="addBlock()">＋ ブロック追加</button></section>
 ${rec?`<section class="card"><h2>💡 今日のおすすめ</h2><p style="margin:8px 0">${rec.text}</p><button class="primary" onclick="useRec('${rec.id}')">この目標を追加</button></section>`:""}
 <section class="card"><h2>⚙ 設定</h2><div class="row"><label>標準ブロック数<select onchange="data.settings.blocks=+this.value;save()">${[2,3,4,5,6,7,8].map(n=>`<option ${data.settings.blocks===n?"selected":""}>${n}</option>`).join("")}</select></label><label>1ブロック<select onchange="data.settings.duration=+this.value;save()">${[15,20,30,45,60,90].map(n=>`<option ${data.settings.duration===n?"selected":""}>${n}分</option>`).join("")}</select></label></div></section>`;
}
function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll('"',"&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function setTask(i,v){ensureBlocks().blocks[i].task=v;localStorage.setItem(KEY,JSON.stringify(data))}
function toggle(i){ensureBlocks().blocks[i].done=!ensureBlocks().blocks[i].done;save()}
function addBlock(){ensureBlocks().blocks.push({task:"",done:false,goalId:""});data.settings.blocks=Math.max(data.settings.blocks,ensureBlocks().blocks.length);save()}
function recommend(){
 if(!data.goals.length)return null;
 const now=new Date();let best=null;
 for(const g of data.goals){
  const count=Object.values(data.logs).reduce((n,l)=>n+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);
  const monthPrefix=iso(now).slice(0,7), monthCount=Object.entries(data.logs).filter(([d])=>d.startsWith(monthPrefix)).reduce((n,[,l])=>n+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);
  const score=(g.priority||2)*2+(g.target>0?Math.max(0,g.target-monthCount):0);
  if(!best||score>best.score)best={id:g.id,score,text:`「${g.name}」は今月 ${monthCount}/${g.target||"∞"}回。${g.target&&monthCount<g.target?"少し遅れ気味なので、今日はこれがおすすめ。":"今日の候補に入れておくのがおすすめ。"}`};
 }
 return best;
}
function useRec(id){let l=ensureBlocks();let i=l.blocks.findIndex(b=>!b.task);if(i<0){alert("空いているブロックがありません。");return}l.blocks[i].task=data.goals.find(g=>g.id===id)?.name||"";l.blocks[i].goalId=id;save()}
function renderHistory(){
 const now=new Date(),arr=[];for(let i=13;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);arr.push(iso(d))}
 document.getElementById("main").innerHTML=`<section class="card"><h2>過去14日</h2><p class="muted">どの日に何コマやったかを一目で確認できます。</p><div class="calendar">${arr.map(s=>{let l=data.logs[s],done=l?.blocks.filter(b=>b.done).length||0,total=l?.blocks.length||0;return `<div class="day"><b>${labelDate(s).slice(2)}</b><div class="dots">${total?`${done}/${total} コマ`:"—"}</div></div>`}).join("")}</div></section>
 <section class="card"><h2>最近の記録</h2>${arr.reverse().map(s=>{let l=data.logs[s];if(!l)return "";let bs=l.blocks.filter(b=>b.task);return `<div class="goal"><b>${labelDate(s)}</b><div class="muted">${bs.length?bs.map(b=>(b.done?"✓ ":"□ ")+esc(b.task)).join("　"): "記録なし"}</div></div>`}).join("")}</section>`;
}
function renderGoals(){
 const cats=["すべて",...new Set(data.goals.map(g=>g.category||"その他"))];
 const active=window.goalFilter||"すべて";
 const list=data.goals.filter(g=>active==="すべて"||(g.category||"その他")===active);
 document.getElementById("main").innerHTML=`<section class="card"><div class="goalhead"><div><h2>やりたいこと</h2><div class="muted">${data.goals.length}件登録</div></div><button class="primary" style="width:auto" onclick="openGoalModal()">＋ 追加</button></div>
 <div class="chips">${cats.map(c=>`<button class="chip ${active===c?"active":""}" onclick="window.goalFilter='${esc(c)}';render()">${esc(c)}</button>`).join("")}</div>
 <div class="goal-list">${list.length?list.map(g=>{
   const month=today().slice(0,7);
   const n=Object.entries(data.logs).filter(([d])=>d.startsWith(month)).reduce((x,[,l])=>x+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);
   const pct=g.target?Math.min(100,Math.round(n/g.target*100)):0;
   return `<div class="goal-row"><div class="goal-main" onclick="openGoalModal('${g.id}')"><div class="goal-name">${esc(g.name)}</div><div class="goal-meta">月${g.target||"—"}回　${["","低","普通","高"][g.priority]||"普通"}　${esc(g.category||"その他")}　${n}/${g.target||"—"}回</div><div class="barline"><i style="width:${pct}%"></i></div></div><div class="goal-actions"><button class="mini" onclick="openGoalModal('${g.id}')">編集</button></div></div>`;
 }).join(""):`<div class="empty">まだ目標がありません</div>`}</div></section>`;
}
function openGoalModal(id){
 const g=id?data.goals.find(x=>x.id===id):null;
 const cats=["勉強","健康","お金","副業","趣味","仕事","その他"];
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="goalModal" onclick="if(event.target===this)closeGoalModal()"><div class="modal-card">
 <div class="goalhead"><h2>${g?"目標を編集":"やりたいことを追加"}</h2><button class="mini" onclick="closeGoalModal()">閉じる</button></div>
 <input id="mName" placeholder="例：読書" value="${g?esc(g.name):""}">
 <div class="row" style="margin-top:8px"><input id="mTarget" type="number" min="0" placeholder="月間目標回数" value="${g?g.target||"":""}"><select id="mPriority"><option value="1" ${g?.priority===1?"selected":""}>低</option><option value="2" ${!g||g.priority===2?"selected":""}>普通</option><option value="3" ${g?.priority===3?"selected":""}>高</option></select></div>
 <select id="mCategory" style="margin-top:8px">${cats.map(c=>`<option ${((g?.category)||"その他")===c?"selected":""}>${c}</option>`).join("")}</select>
 <div class="muted" style="margin:10px 0 5px">できればこの曜日にやりたい（任意）</div>
 <div class="days">${["月","火","水","木","金","土","日"].map((d,i)=>`<label><input type="checkbox" id="day${i}" ${g?.days?.includes(i)?"checked":""}>${d}</label>`).join("")}</div>
 <button class="primary" style="margin-top:14px" onclick="saveGoal('${g?.id||""}')">${g?"保存":"登録"}</button>
 ${g?`<button class="secondary" style="width:100%;margin-top:8px" onclick="deleteGoal('${g.id}');closeGoalModal()">削除</button>`:""}
 </div></div>`);
}
function closeGoalModal(){document.getElementById("goalModal")?.remove()}
function saveGoal(id){
 const name=document.getElementById("mName").value.trim(); if(!name)return alert("目標名を入力してください");
 const g=id?data.goals.find(x=>x.id===id):{id:Date.now().toString()};
 g.name=name;g.target=+document.getElementById("mTarget").value||0;g.priority=+document.getElementById("mPriority").value;g.category=document.getElementById("mCategory").value;g.days=[0,1,2,3,4,5,6].filter(i=>document.getElementById("day"+i).checked);
 if(!id)data.goals.push(g);
 closeGoalModal();save();
}
function addGoal(){openGoalModal()}
function deleteGoal(id){if(confirm("この目標を削除しますか？")){data.goals=data.goals.filter(g=>g.id!==id);save()}}
function setTask(i,v){const b=ensureBlocks().blocks[i];b.task=v;b.goalId="";localStorage.setItem(KEY,JSON.stringify(data))}
function showTaskCandidates(i,q=""){
 const box=document.getElementById("cand-"+i); if(!box)return;
 const query=(q||"").toLowerCase().trim();
 const month=today().slice(0,7);
 const arr=data.goals.map(g=>{
   const count=Object.entries(data.logs).filter(([d])=>d.startsWith(month)).reduce((n,[,l])=>n+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);
   let last=null;Object.entries(data.logs).forEach(([d,l])=>{if(l.blocks.some(b=>b.goalId===g.id&&b.done)&&(!last||d>last))last=d});
   const days=last?Math.floor((new Date(today()+"T00:00:00")-new Date(last+"T00:00:00"))/86400000):null;
   return {g,count,days};
 }).filter(x=>!query||x.g.name.toLowerCase().includes(query));
 if(!arr.length){box.classList.add("hidden");return}
 box.innerHTML=arr.map(x=>`<button type="button" onclick="pickGoalForBlock(${i},'${x.g.id}')"><b>🎯 ${esc(x.g.name)}</b><div class="suggest-meta">今月 ${x.count}/${x.g.target||"—"}回　${x.days===null?"まだ実行なし":x.days===0?"今日実行済み":x.days+"日前"}</div></button>`).join("");
 box.classList.remove("hidden");
}
function pickGoalForBlock(i,id){
 const g=data.goals.find(x=>x.id===id);if(!g)return;
 const b=ensureBlocks().blocks[i];b.task=g.name;b.goalId=g.id;localStorage.setItem(KEY,JSON.stringify(data));render();
}
document.addEventListener("click",e=>{if(!e.target.closest(".task"))document.querySelectorAll(".suggest").forEach(x=>x.classList.add("hidden"))});
function renderStats(){
 const prefix=today().slice(0,7), entries=Object.entries(data.logs).filter(([d])=>d.startsWith(prefix));
 const total=entries.reduce((n,[,l])=>n+l.blocks.length,0);
 const done=entries.reduce((n,[,l])=>n+l.blocks.filter(b=>b.done).length,0);
 const activeDays=entries.filter(([,l])=>l.blocks.some(b=>b.task)).length;
 const duration=data.settings.duration||30, hours=(total*duration/60).toFixed(1).replace(".0","");
 const dayMap={};entries.forEach(([d,l])=>dayMap[d]=l);
 let maxDay=0,maxDayDate="",maxDoneRate=0,maxDayTime=0;
 entries.forEach(([d,l])=>{const n=l.blocks.length,dd=l.blocks.filter(b=>b.done).length;if(n>maxDay){maxDay=n;maxDayDate=d}if(n&&dd/n>maxDoneRate)maxDoneRate=dd/n;maxDayTime=Math.max(maxDayTime,n*duration)});
 function streak(){
   let cur=0,best=0;
   const ds=[];for(let i=0;i<31;i++){const d=new Date(new Date(prefix+"-01T00:00:00"));d.setDate(d.getDate()+i);if(d.getMonth()!==new Date(prefix+"-01T00:00:00").getMonth())break;ds.push(iso(d))}
   let run=0;ds.forEach(d=>{if(dayMap[d]?.blocks?.some(b=>b.task)){run++;best=Math.max(best,run)}else run=0});
   let current=0;for(let i=ds.length-1;i>=0;i--){if(dayMap[ds[i]]?.blocks?.some(b=>b.task))current++;else break}
   return [current,best];
 }
 const [curStreak,bestStreak]=streak();
 let gap=0,bestGap=0;const first=new Date(prefix+"-01T00:00:00");const last=new Date(first.getFullYear(),first.getMonth()+1,0);
 for(let d=new Date(first);d<=last;d.setDate(d.getDate()+1)){if(!dayMap[iso(d)]?.blocks?.some(b=>b.task)){gap++;bestGap=Math.max(bestGap,gap)}else gap=0}
 const weeks=[];for(let w=0;w<5;w++){let c=0;for(let i=0;i<7;i++){const d=new Date(first);d.setDate(1+w*7+i);if(d.getMonth()===first.getMonth()){const l=dayMap[iso(d)];c+=l?.blocks?.length||0}}weeks.push(c)}
 const weekdays=[0,0,0,0,0,0,0];entries.forEach(([d,l])=>{const dow=new Date(d+"T00:00:00").getDay();weekdays[dow]+=l.blocks.length});
 const maxWeek=Math.max(1,...weeks),maxWd=Math.max(1,...weekdays);
 const cats={};entries.forEach(([,l])=>l.blocks.forEach(b=>{if(b.done&&b.goalId){const g=data.goals.find(x=>x.id===b.goalId);const c=g?.category||"その他";cats[c]=(cats[c]||0)+1}else if(b.done){cats["その他"]=(cats["その他"]||0)+1}}));
 document.getElementById("main").innerHTML=`<section class="card"><h2>今月の総合サマリー</h2><div class="stat-grid"><div class="stat"><b>${total}</b><span>総コマ</span></div><div class="stat"><b>${hours}h</b><span>総時間</span></div><div class="stat"><b>${done}</b><span>完了コマ</span></div><div class="stat"><b>${total?Math.round(done/total*100):0}%</b><span>完了率</span></div><div class="stat"><b>${activeDays}</b><span>活動日</span></div></div></section>
 <section class="card"><h2>🏆 今月のベスト記録</h2><div class="goal"><b>最高活動量</b><span style="float:right">${maxDay}コマ</span><div class="muted">${maxDayDate?labelDate(maxDayDate):"—"}</div></div><div class="goal"><b>最高活動時間</b><span style="float:right">${(maxDayTime/60).toFixed(1).replace(".0","")}時間</span></div><div class="goal"><b>最高完了率</b><span style="float:right">${Math.round(maxDoneRate*100)}%</span></div></section>
 <section class="card"><h2>📊 週ごとの活動量</h2><div class="chart">${weeks.map((n,i)=>`<div class="barcol"><i style="height:${Math.round(n/maxWeek*100)}%"></i><small>${i+1}週</small><small>${n}コマ</small></div>`).join("")}</div></section>
 <section class="card"><h2>🎯 目標別進捗</h2>${data.goals.length?data.goals.map(g=>{const n=entries.reduce((x,[,l])=>x+l.blocks.filter(b=>b.goalId===g.id&&b.done).length,0);const p=g.target?Math.min(100,Math.round(n/g.target*100)):0;return `<div class="goal"><div class="goalhead"><b>${esc(g.name)}</b><span>${n}/${g.target||"—"}回</span></div><div class="barline"><i style="width:${p}%"></i></div><div class="muted">${g.target?`達成率 ${p}%・残り ${Math.max(0,g.target-n)}回`:"目標回数未設定"}</div></div>`}).join(""):`<div class="empty">目標を登録すると表示されます</div>`}</section>
 <section class="card"><h2>🗂 カテゴリ別の時間</h2>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<div class="goal"><b>${esc(c)}</b><span style="float:right">${(n*duration/60).toFixed(1).replace(".0","")}時間</span><div class="muted">${n}コマ</div></div>`).join(""):`<div class="empty">完了した目標からカテゴリを集計します</div>`}</section>
 <section class="card"><h2>📅 曜日別の傾向</h2>${["日","月","火","水","木","金","土"].map((d,i)=>`<div class="goal"><b>${d}</b><span style="float:right">${weekdays[i]}コマ</span><div class="barline"><i style="width:${Math.round(weekdays[i]/maxWd*100)}%"></i></div></div>`).join("")}</section>
 <section class="card"><h2>🔥 連続記録</h2><div class="stat-grid"><div class="stat"><b>${curStreak}日</b><span>現在の連続活動</span></div><div class="stat"><b>${bestStreak}日</b><span>今月の最高連続</span></div></div></section>
 <section class="card"><h2>🌙 活動しなかった日</h2><div class="stat-grid"><div class="stat"><b>${last.getDate()+1-activeDays}</b><span>非活動日（当月）</span></div><div class="stat"><b>${bestGap}日</b><span>最長未活動期間</span></div></div></section>`;
}
render();
</script>
</body>
</html>
